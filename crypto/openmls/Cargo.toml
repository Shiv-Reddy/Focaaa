[package]
name = "focaaa-openmls-compatibility"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
publish = false

[lib]
name = "focaaa_openmls"
crate-type = ["cdylib", "rlib"]

[dependencies]
jni = "=0.21.1"
openmls = { version = "=0.9.2", features = ["openmls_rust_crypto"] }
openmls_basic_credential = "=0.6.0"
openmls_memory_storage = "=0.6.0"
openmls_rust_crypto = "=0.6.0"
openmls_traits = "=0.6.0"
